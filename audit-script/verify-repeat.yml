---
- name: Capture state immediately before reapplying hardening
  hosts: linux_debian_13
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    snapshot_phase: before
  tasks: &save_snapshot
    - name: Capture host state without changing configuration
      ansible.builtin.script:
        cmd: "{{ (playbook_dir ~ '/snapshot-state.sh') | quote }}"
        executable: /bin/bash
      register: snapshot
      changed_when: false

    - name: Save snapshot on the Ansible controller
      ansible.builtin.copy:
        content: "{{ 'INVENTORY_HOST=' ~ inventory_hostname ~ '\n' ~ snapshot.stdout | replace('\r\n', '\n') }}"
        dest: "{{ lookup('ansible.builtin.env', 'CIS_REPEAT_REPORT_DIR', default=undef()) }}/{{ snapshot_phase }}-{{ inventory_hostname | hash('sha256') }}.txt"
        mode: '0600'
      delegate_to: localhost
      become: false
      diff: false
      changed_when: false

- name: Reapply the same hardening playbook once
  ansible.builtin.import_playbook: ../playbooks/site.yml

- name: Capture state immediately after reapplying hardening
  hosts: linux_debian_13
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    snapshot_phase: after
  tasks: *save_snapshot
