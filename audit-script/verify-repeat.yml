---
- name: Capture state after the initial hardening run
  hosts: linux_debian_13
  become: true
  gather_facts: false
  tasks:
    - name: Collect baseline for the repeated run
      ansible.builtin.script:
        cmd: ../audit-script/audit-cis-debian13-v1.1.0.sh --snapshot
        executable: /bin/bash
      register: cis_before_repeat
      changed_when: false
    - name: Record the baseline for each host
      ansible.builtin.debug:
        var: cis_before_repeat.stdout_lines

- name: Repeat the same hardening play
  ansible.builtin.import_playbook: ../playbooks/site.yml

- name: Compare the state after the repeated run
  hosts: linux_debian_13
  become: true
  gather_facts: false
  tasks:
    - name: Collect state after the repeated run
      ansible.builtin.script:
        cmd: ../audit-script/audit-cis-debian13-v1.1.0.sh --snapshot
        executable: /bin/bash
      register: cis_after_repeat
      changed_when: false
    - name: Record state after the repeated run for each host
      ansible.builtin.debug:
        var: cis_after_repeat.stdout_lines
    - name: Compare file hashes, permissions, owners, boot ID and active audit rules
      ansible.builtin.assert:
        that:
          - cis_before_repeat.stdout_lines == cis_after_repeat.stdout_lines
        success_msg: "Snapshots agree for the measured state."
        fail_msg: "Snapshots differ. Compare the recorded lines for this host."
