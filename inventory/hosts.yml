---
linux_hardening:
  children:
    debian_srv:
      hosts:
        lin-deb-server:
          ansible_host: 192.168.100.10

  vars:
    ansible_user: srvadmin
    ansible_ssh_private_key_file: ~/.ssh/rsa_ansible_key
    ansible_python_interpreter: /usr/bin/python3
    ansible_become: true
    ansible_become_method: sudo