---
- name: "6.2.1.1 Ensure auditd packages are installed"
  when: deb13cis_rule_6_2_1_1 | bool
  ansible.builtin.package:
    name:
      - auditd
      - audispd-plugins
    state: present

- name: "6.2.1.2 Ensure auditd service is enabled and active"
  when: deb13cis_rule_6_2_1_2 | bool
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
    masked: false

- name: "6.2.3.1 Ensure modification of the /etc/sudoers file is collected"
  wneh: deb13cis_rule_6_2_3_1 | bool
  ansible.builtin.set_fact:
    update_audit_template: true

- name: "6.2.3.12 Ensure events that modify /etc/group information are collected"
  when: deb13cis_rule_6_2_3_12 | bool
  ansible.builtin.set_fact:
    update_audit_template: true

- name: "6.2.3.13 Ensure events that modify /etc/passwd information are collected"
  when: deb13cis_rule_6_2_3_13 | bool
  ansible.builtin.set_fact:
    update_audit_template: true

- name: "6.2.3.14 Ensure events that modify /etc/shadow and /etc/gshadow are collected"
  when: deb13cis_rule_6_2_3_14 | bool
  ansible.builtin.set_fact:
    update_audit_template: true

- name: "6.2.3.x deploy auditd rules"
  when: >-
    deb13cis_rule_6_2_3_1 | bool or
    deb13cis_rule_6_2_3_12 | bool or
    deb13cis_rule_6_2_3_13 | bool or
    deb13cis_rule_6_2_3_14 | bool
  notify: load audit rules
  ansible.builtin.template:
    src: "50-identity.rules.j2"
    dest: "/etc/audit/rules.d/50-identity.rules"
    owner: root
    group: root
    mode: 0640