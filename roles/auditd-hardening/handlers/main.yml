---
- name: "load audit rules"
  ansible.builtin.command: "augenrules --load"
  changed_when: false

- name: "generate auditd rules"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/auditd/rules.d/{{ item }}"
    owner: root
    group: root
    mode: 0640
  item: 50-identity.rules