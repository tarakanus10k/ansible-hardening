---
# 1) 5.1.1 Ensure access to /etc/ssh/sshd_config is configured
# 2) 5.1.2 Ensure access to /etc/ssh/sshd_config.d/ directory is configured
# 3) 5.1.15 Ensure sshd LoginGraceTime is configured
# 4) 5.1.18 Ensure sshd MaxAuthTries is configured
# 6) 5.1.22 Ensure sshd PermitRootLogin is disabled

# ---

# 5.1.1 Ensure access to /etc/ssh/sshd_config is configured
- name: "5.1.1 Ensure access to /etc/ssh/sshd_config is configured"
  when: deb13cis_rule_5_1_1
  ansible.builtin.file:
    path: "/etc/ssh/sshd_config"
    owner: root
    group: root
    mode: 0600

# 5.1.2 Ensure access to /etc/ssh/sshd_config.d/ directory is configured
- name: "5.1.2 Ensure access to /etc/ssh/sshd_config.d/ directory is configured"
  when: deb13cis_rule_5_1_2
  block:
    - name: "5.1.2 | /etc/ssh/sshd_config.d/"
      ansible.builtin.file:
        path: "/etc/ssh/sshd_config.d/"
        owner: root
        group: root
        mode: 0700

    - name: "5.1.2 | find /etc/ssh/sshd_config.d/*.conf"
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d/
        file_type: file
      register: sshd_config_files

    - name: "5.1.2 | /etc/ssh/sshd_config.d/*.conf"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 0600
      loop: "{{ sshd_config_files.files }}"

# 5.1.15 Ensure sshd LoginGraceTime is configured
- name: "5.1.15 Ensure sshd LoginGraceTime is configured"
  when: deb13cis_rule_5_1_15
  ansible.builtin.set_fact:
    update_sshd_template: true

# 5.1.18 Ensure sshd MaxAuthTries is configured
- name: "5.1.18 Ensure sshd MaxAuthTries is configured"
  when: deb13cis_rule_5_1_18
  ansible.builtin.set_fact:
    update_sshd_template: true

# 5.1.22 Ensure sshd PermitRootLogin is disabled
- name: "5.1.22 Ensure sshd PermitRootLogin is disabled"
  when: deb13cis_rule_5_1_22
  ansible.builtin.set_fact:
    update_sshd_template: true

- name: "Deploy ssh rules"
  when: update_sshd_template
  notify: Restart sshd
  ansible.builtin.template:
    src: "10-ssh-hardening.conf.j2"
    dest: "/etc/ssh/sshd_config.d/10-ssh-hardening.conf"
    owner: root
    group: root
    mode: 0600
    validate: sshd -t -f %s