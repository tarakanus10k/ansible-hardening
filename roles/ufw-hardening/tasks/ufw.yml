---
- name: "4.1.1 Ensure ufw is installed"
  wneh: deb13cis_rule_4_1_1 | bool
  ansible.builtin.package:
    pkg: ufw
    state: present
    update_cache: true

- name: "4.1.3 Ensure ufw incoming default is configured"
  when: deb13cis_rule_4_1_3 | bool
  block:
    - name: "4.1.3 Ensure ufw incoming default is configured | allow ssh"
      community.general.ufw:
        rule: allow
        direction: incoming
        proto: tcp
        from_ip: "{{ managment_source }}"
        to_port: 22
    - name: "4.1.3 Ensure ufw incoming default is configured | allow web"
      community.general.ufw:
        rule: allow
        direction: incoming
        proto: tcp
        to_port: "{{ item }}"
      loop: "{{ web_ports }}"
    - name: "4.1.3 Ensure ufw incoming default is configured | deny all"
      community.general.ufw:
        rule: deny
        direction: incoming

- name: "4.1.4 Ensure ufw outgoing default is configured"
  when: deb13cis_rule_4_1_4 | bool
  block:
    - name: "4.1.4 Ensure ufw outgoing default is configured | allow http,https"
      community.general.ufw:
        rule: allow
        direction: outgoing
        proto: tcp
        to_port: "{{ item }}"
      loop:
        - 80
        - 443