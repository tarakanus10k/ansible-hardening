---
- name: "5.3.1.1 Ensure latest version of pam is installed"
  ansible.builtin.apt:
    pkg:
    - libpam-runtime
    state: latest
    update_cache: true
  when: deb13cis_rule_5_3_1_1 | bool

- name: "5.3.2.2 Ensure pam_faillock module is enabled | CHECK01"
  ansible.builtin.shell: grep -P -- '\bpam_faillock\.so\b' /etc/pam.d/common-auth
  register: faillock_auth_check
  changed_when: false
  failed_when: false
  when: deb13cis_rule_5_3_2_2 | bool

- name: "5.3.2.2 Ensure pam_faillock module is enabled | CHECK02"
  ansible.builtin.shell: grep -P -- '\bpam_faillock\.so\b' /etc/pam.d/common-account
  register: faillock_account_check
  changed_when: false
  failed_when: false
  when: deb13cis_rule_5_3_2_2 | bool

- name: "5.3.2.2 Ensure pam_faillock module is enabled | PATCH"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/share/pam-configs/{{ item }}"
    owner: root
    group: root
    mode: 0600
  loop:
    - faillock
    - faillock_notify
  notify:
    - enable_faillock
    - enable_faillock_notify

- name: "5.3.3.1.1 Ensure password failed attempts lockout is configured"
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*deny\s*=\s*[1-5]\b'
    line: "deny = 5"
    backup: true
  when: deb13cis_rule_5_3_3_1_1 | bool