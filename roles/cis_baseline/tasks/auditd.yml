---
# Проверка установлен ли Auditd + audispd-plugins. Установка при его отсутствии
- name: "6.2.1.1 Ensure auditd packages are installed"
  ansible.builtin.apt:
    pkg:
    - auditd
    - audispd-plugins
    state: present
  when: deb13cis_rule_6_2_1_1 | bool

# Проверка включен ли пакет Auditd
- name: "6.2.1.2 Ensure auditd service is enabled and active"
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
    masked: false
  when: deb13cis_rule_6_2_1_2 | bool

# Собирать информацию об изменении /etc/group
- name: "6.2.3.12 Ensure events that modify /etc/group information are collected"
  ansible.builtin.blockinfile:
    path: /etc/audit/rules.d/50-identity.rules
    block: "-a always,exit -F arch=b64 -F path=/etc/group -F perm=wa -k identity"
    create: true
    owner: root
    group: root
    mode: 0700
  notify: load audit rules
  when: deb13cis_rule_6_2_3_12 | bool

# Собирать информацию об изменении /etc/passwd
- name: "6.2.3.13 Ensure events that modify /etc/passwd information are collected"
  ansible.builtin.blockinfile:
    path: /etc/audit/rules.d/50-identity.rules
    block: "-a always,exit -F arch=b64 -F path=/etc/passwd -F perm=wa -k identity"
    create: true
    owner: root
    group: root
    mode: 0700
  notify: load audit rules
  when: deb13cis_rule_6_2_3_13 | bool

# Собирать информацию об изменении /etc/shadow, /etc/gshadow
- name: "6.2.3.14 Ensure events that modify /etc/shadow and /etc/gshadow are collected"
  ansible.builtin.blockinfile:
    path: /etc/audit/rules.d/50-identity.rules
    block: |
      -a always,exit -F arch=b64 -F path=/etc/gshadow -F perm=wa -k identity
      -a always,exit -F arch=b64 -F path=/etc/shadow -F perm=wa -k identity
    create: true
    owner: root
    group: root
    mode: 0700
  notify: load audit rules
  when: deb13cis_rule_6_2_3_14 | bool