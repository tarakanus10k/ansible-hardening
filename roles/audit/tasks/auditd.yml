---
# 6.2.1.1 Ensure auditd packages are installed
# 6.2.1.2 Ensure auditd service is enabled and active
# 6.2.3.1 Ensure modification of the /etc/sudoers file is collected
# 6.2.3.12 Ensure events that modify /etc/group information are collected
# 6.2.3.13 Ensure events that modify /etc/passwd information are collected
# 6.2.3.14 Ensure events that modify /etc/shadow and /etc/gshadow are collected

# ---

# 6.2.1.1 Ensure auditd packages are installed
- name: "6.2.1.1 Ensure auditd packages are installed"
  when: deb13cis_rule_6_2_1_1
  ansible.builtin.package:
    name:
      - auditd
      - audispd-plugins
    state: present 

# 6.2.1.2 Ensure auditd service is enabled and active
- name: "6.2.1.2 Ensure auditd service is enabled and active"
  when: deb13cis_rule_6_2_1_2
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
    masked: false

# 6.2.3.1 Ensure modification of the /etc/sudoers file is collected
- name: "6.2.3.1 Ensure modification of the /etc/sudoers file is collected"
  when: deb13cis_rule_6_2_3_1
  ansible.builtin.set_fact:
    update_audit_template: true

# 6.2.3.12 Ensure events that modify /etc/group information are collected
- name: "6.2.3.12 Ensure events that modify /etc/group information are collected"
  when: deb13cis_rule_6_2_3_12
  ansible.builtin.set_fact:
    update_audit_template: true

# 6.2.3.13 Ensure events that modify /etc/passwd information are collected
- name: "6.2.3.13 Ensure events that modify /etc/passwd information are collected"
  when: deb13cis_rule_6_2_3_13
  ansible.builtin.set_fact:
    update_audit_template: true

# 6.2.3.14 Ensure events that modify /etc/shadow and /etc/gshadow are collected
- name: "6.2.3.14 Ensure events that modify /etc/shadow and /etc/gshadow are collected"
  when: deb13cis_rule_6_2_3_14
  ansible.builtin.set_fact:
    update_audit_template: true

- name: "Deploy auditd rules"
  when: >-
    deb13cis_rule_6_2_3_1 or
    deb13cis_rule_6_2_3_12 or
    deb13cis_rule_6_2_3_13 or
    deb13cis_rule_6_2_3_14
  notify: Load auditd rules
  ansible.builtin.template:
    src: "{{ item }}.rules.j2"
    dest: "/etc/audit/rules.d/{{ item }}.rules"
    owner: root
    group: root
    mode: 0640
  loop:
    - 50-identity
    - 50-scope