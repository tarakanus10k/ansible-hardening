- name: "5.2.1 Ensure sudo is installed"
  when: deb13cis_rule_5_2_1 | bool
  ansible.builtin.package:
    pkg:
    - sudo
    - libsss-sudo
    state: present
    update_cache: true

- name: "5.2.3 Ensure sudo log file exists"
  when: deb13cis_rule_5_2_3 | bool
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^Defaults\s*logfile='
    line: 'Defaults logfile="/var/log/sudo.log"'
    validate: '/usr/sbin/visudo -cf %s'

- name: "5.2.6 Ensure sudo timestamp_timeout is configured"
  when: deb13cis_rule_5_2_6 | bool
  block:
    - name: "5.2.6 | list files in /etc/sudoers.d/"
      ansible.builtin.find:
        paths: /etc/sudoers.d/
        file_type: file
      register: cis526_sudoers_files

    - name: "5.2.6 | delete timestamp_timeout = -[1-9]"
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^\s*Defaults\s+timestamp_timeout\s*=\s*-\d+\s*$'
        state: absent
        validate: '/usr/sbin/visudo -cf %s'
      loop: "{{ ['/etc/sudoers'] + (cis526_sudoers_files.files | map(attribute='path') | list) }}"

    - name: "5.2.6 | add timestamp_timeout"
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: '^Defaults\s*timestamp_timeout=\d+'
        line: 'Defaults timestamp_timeout=10'
        validate: '/usr/sbin/visudo -cf %s'