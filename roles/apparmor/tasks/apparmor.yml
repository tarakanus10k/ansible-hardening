# 1.3.1.1 Ensure apparmor packages are installed
# 1.3.1.2 Ensure AppArmor is enabled
# 1.3.1.4 Ensure kernel.apparmor_restrict_unprivileged_unconfined is enabled

# ---

# 1.3.1.1 Ensure apparmor packages are installed
- name: "1.3.1.1 Ensure apparmor packages are installed"
  when: deb13cis_rule_1_3_1_1
  ansible.builtin.package:
    name:
      - apparmor
      - apparmor-utils
    state: present

# 1.3.1.2 Ensure AppArmor is enabled
- name: "1.3.1.2 Ensure AppArmor is enabled"
  when: deb13cis_rule_1_3_1_2
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: 'apparmor=0'
    line: ''
  notify: Update-grub

# 1.3.1.4 Ensure kernel.apparmor_restrict_unprivileged_unconfined is enabled
- name: "1.3.1.4 Ensure kernel.apparmor_restrict_unprivileged_unconfined is enabled"
  when: deb13cis_rule_1_3_1_4
  block:
    - name: "1.3.1.4 | find files"
      ansible.builtin.find:
        path: /etc/sysctl.d
        file_type: file
        patterns: "*.conf"
        read_whole_file: true
        contains: ^\s*apparmor_restrict_unprivileged_unconfined\s*=\s*\d
      register: discovered_apparmor_sysctl

    - name: "1.3.1.4 | comment out files"
      when: item.path != '/etc/sysctl.d/60-kernel_sysctl.conf'
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: (apparmor_restrict_unprivileged_unconfined\s*=\s*\d)
        replace: '#\1 # Commented out for CIS 1.3.1.4 - set in /etc/sysctl.d/60-kernel_sysctl.conf'
      loop: "{{ discovered_apparmor_sysctl.files }}"

    - name: "1.3.1.4 | Ensure kernel.apparmor_restrict_unprivileged_unconfined is enabled"
      ansible.posix.sysctl:
        name: kernel.apparmor_restrict_unprivileged_unconfined
        value: '1'
        sysctl_file: /etc/sysctl.d/60-kernel_sysctl.conf
        sysctl_set: true
        reload: true