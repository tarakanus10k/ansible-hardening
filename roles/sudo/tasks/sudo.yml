---
# 1) 5.2.6 Ensure sudo timestamp_timeout is configured
# 2) 5.2.7 Ensure access to the su command is restricted

# ---

# 5.2.6 Ensure sudo timestamp_timeout is configured
- name: "5.2.6 Ensure sudo timestamp_timeout is configured"
  when: deb13cis_rule_5_2_6
  block:
    - name: "5.2.6 | files with timestamp_timeout"
      ansible.builtin.shell: |
        set -o pipefail
        grep -is 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/* | cut -d":" -f1 | uniq | sort
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      register: discovered_sudo_timeout_files

    - name: "5.2.6 | change timestamp_timeout if == 0"
      when: discovered_sudo_timeout_files.stdout | length == 0
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: '^Defaults timestamp_timeout='
        line: "Defaults timestamp_timeout=5"
        validate: '/usr/sbin/visudo -cf %s'

    - name: "5.2.6 | change timestamp_timeout if >= 1"
      when: discovered_sudo_timeout_files.stdout | length > 0
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^([ \t]*Defaults[^#\n]*timestamp_timeout[ \t]*=[ \t]*)-?[0-9.]+'
        replace: '\g<1>5'
        validate: '/usr/sbin/visudo -cf %s'
      loop: "{{ discovered_sudo_timeout_files.stdout_lines }}"

# 5.2.7 Ensure access to the su command is restricted
- name: "5.2.7 Ensure access to the su command is restricted"
  when: deb13cis_rule_5_2_7
  block:
    - name: "5.2.7 | Ensure sugroup exists"
      ansible.builtin.group:
        name: "sugroup"
        state: present

    - name: "5.2.7 | remove users from group"
      ansible.builtin.lineinfile:
        path: /etc/group
        regexp: '^sugroup(:.:.*:).*$'
        line: 'sugroup\g<1>'
        backrefs: true

    - name: "5.2.7 | Setting pam_wheel to use_uid"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        regexp: '^(#)?auth\s+required\s+pam_wheel\.so'
        line: 'auth           required        pam_wheel.so use_uid group=sugroup'